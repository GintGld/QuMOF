[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qumof"
version = "0.2.0"
description = "Deterministic MOF arrangement/topology ranking pipeline with optional A1/A2/A67 runtime agents"
requires-python = ">=3.12,<3.13"
# The pipeline core is standard-library Python. These packages run the periodic DFT engine
# (protocols.dft.engine = "pyscf"): PySCF GPW, DFT-D3/D4 dispersion and ASE relaxations.
dependencies = [
    "pyscf>=2.14",
    "pyscf-dispersion>=1.5",
    "ase>=3.23",
    "numpy>=2.5.4"
]

[project.optional-dependencies]
test = ["pytest>=7"] # TODO move this to dev
# protocols.dft.device = "gpu": pick the gpu4pyscf wheel matching the installed CUDA toolkit (cuda11x/cuda12x/...).
gpu = ["gpu4pyscf-cuda12x>=1.8"]
# Runtime agents (python -m qumof agents): OpenRouter requests, strict schemas, controls.yaml, LangGraph
# orchestration, Valency MCP client, local PDF text and the reference datasets (parquet + HDF5, Hugging Face). The deterministic pipeline never imports these.
agents = ["requests>=2.31", "jsonschema>=4.21", "pyyaml>=6", "langgraph>=0.4", "mcp>=1.9,<2", "pypdf>=4", # TODO migrate to mcp>=2
          "pandas>=2", "pyarrow>=14", "h5py>=3.9", "huggingface_hub>=0.23"]
# Task 02 ML-potential screening (protocols.ml_potential): orb-v3 conservative (OMat24) + D3(BJ) through ASE.
# Needs Python <= 3.13 (dm-tree): install into a separate interpreter (README: .venv-mlip) named by protocols.*.python.
mlip = ["orb-models>=0.7"]
# Topology generation (protocols.topology_generation): PORMAKE nets, blocks and builder (pulls jax[cpu], pymatgen).
topology = ["pormake==0.2.3"]
# T04.3: QAOA sampling on Qiskit fake IBM devices (qpu_worker.py).
qpu = ["qiskit>=2.0", "qiskit-aer>=0.17", "qiskit-ibm-runtime>=0.40"]
# T10.1: AiiDA WorkChain engine with stage provenance (local `verdi presto` profile, no services).
aiida = ["aiida-core>=2.6"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "pyscf: runs real PySCF calculations (minutes on a laptop CPU); deselect with -m 'not pyscf'",
]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["src"]
exclude = ["**/__pycache__", "**/.venv", "notebooks", "third_party"]

typeCheckingMode = "basic"           # takes precedence over "python.analysis.typeCheckingMode" in VS Code settings
strict = []                          # add modules here as they're migrated

reportUnnecessaryTypeIgnoreComment = "error" # flags stale ignores

# TODO to add to readme "git config blame.ignoreRevsFile .git-blame-ignore-revs -- each dev runs this once"
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["graphify-out/", "docs/"]   # whatever shouldn't be touched

[tool.ruff.lint]
select = [
  "E4", "E7", "E9", "F",   # ruff's defaults: real errors (undefined names, unused imports...)
  "I",                     # import sorting
  "UP",                    # modern syntax
  "B",                     # bugbear: likely bugs
  "SIM",                   # simplifications
  "RUF",                   # ruff-specific, incl. RUF100 = flags stale noqa comments
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]   # re-exports look like unused imports

[tool.ruff.format]
docstring-code-format = true